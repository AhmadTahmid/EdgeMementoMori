<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memento Mori</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@300;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="background-overlay"></div>

    <div class="content-container">
        <h1 class="title">MEMENTO MORI</h1>

        <div class="timer-container">
            <div class="time-unit">
                <span id="days" class="number">00000</span>
                <span class="label">DAYS</span>
            </div>
            <div class="separator">:</div>
            <div class="time-unit">
                <span id="hours" class="number">00</span>
                <span class="label">HOURS</span>
            </div>
            <div class="separator">:</div>
            <div class="time-unit">
                <span id="minutes" class="number">00</span>
                <span class="label">MINUTES</span>
            </div>
            <div class="separator">:</div>
            <div class="time-unit">
                <span id="seconds" class="number">00</span>
                <span class="label">SECONDS</span>
            </div>
        </div>

        <button id="acknowledge-btn" class="acknowledge-btn">Carpe Diem</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
